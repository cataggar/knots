name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  attestations: read

jobs:
  fmt:
    name: zig fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@v0.10.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.17.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
      - run: zig fmt --check build.zig web_build.zig src lib examples tests

  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux-gnu
            os: ubuntu-latest
            target_flag: ""

          - name: aarch64-macos
            os: macos-latest
            target_flag: ""

          - name: x86_64-windows-msvc
            os: windows-latest
            target_flag: -Dtarget=x86_64-windows-msvc

          - name: x86_64-windows-gnu
            os: windows-latest
            target_flag: -Dtarget=x86_64-windows-gnu

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5
      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@v0.10.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.17.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
      - name: Install Wayland development packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev wayland-protocols libxkbcommon-dev pkg-config

      - name: Pre-fetch wgpu macOS archive
        if: runner.os == 'macOS'
        run: |
          mkdir -p zig-pkg/N-V-__8AAJUIAwqjxINeHG1uHPzXC1quY1Xb2eDKehZkywov
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/wgpu-macos-aarch64-debug.zip" \
            https://github.com/gfx-rs/wgpu-native/releases/download/v29.0.1.1/wgpu-macos-aarch64-debug.zip
          unzip -q "$RUNNER_TEMP/wgpu-macos-aarch64-debug.zip" \
            -d zig-pkg/N-V-__8AAJUIAwqjxINeHG1uHPzXC1quY1Xb2eDKehZkywov
          rm -f "$RUNNER_TEMP/wgpu-macos-aarch64-debug.zip"

      - name: knots
        run: zig build test ${{ matrix.target_flag }} --summary all

      - name: lib/accesskit
        working-directory: lib/accesskit
        run: zig build test ${{ matrix.target_flag }} --summary all

      - name: lib/js-bridge
        working-directory: lib/js-bridge
        run: zig build test ${{ matrix.target_flag }} --summary all

  wasi:
    name: wasm32-wasi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig and Wasmtime via ghr
        uses: cataggar/ghr/actions/install@v0.10.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.17.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
            bytecodealliance/wasmtime@v50.0.1

      - name: knots
        run: zig build test -Dtarget=wasm32-wasi -fwasmtime --summary all

      - name: knots (webgl2)
        run: zig build test -Dtarget=wasm32-wasi -Dgpu_backend=webgl2 -fwasmtime --summary all

      - name: lib/js-bridge
        working-directory: lib/js-bridge
        run: zig build test -Dtarget=wasm32-wasi -fwasmtime --summary all

  browser:
    name: wasm32-freestanding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@v0.10.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.17.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Build playground
        working-directory: examples/playground
        run: zig build -Dtarget=wasm32-freestanding --summary all

      - name: Build playground (webgl2)
        working-directory: examples/playground
        run: zig build -Dtarget=wasm32-freestanding -Dgpu_backend=webgl2 --summary all
