name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  attestations: read

jobs:
  fmt:
    name: zig fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install wazig and Wasmtime
        uses: cataggar/ghr/actions/install@v0.10.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.17.0-wazig.4
            bytecodealliance/wasmtime@v50.0.1
      - name: Cache Zig and Wasmtime
        uses: actions/cache@v4
        with:
          path: |
            .zig-global-cache
            ~/.cache/wasmtime
          key: wazig-cache-${{ runner.os }}-${{ hashFiles('build.zig.zon', 'build.zig', 'web_build.zig') }}
          restore-keys: |
            wazig-cache-${{ runner.os }}-
      - name: Configure Wasmtime cache
        run: |
          mkdir -p "$HOME/.cache/wasmtime/cache" "$GITHUB_WORKSPACE/.zig-global-cache"
          cat > "$HOME/.cache/wasmtime/config.toml" <<EOF
          [cache]
          enabled = true
          directory = "$HOME/.cache/wasmtime/cache"
          EOF
          echo "WASMTIME_CACHE_CONFIG=$HOME/.cache/wasmtime/config.toml" >> "$GITHUB_ENV"
          echo "ZIG_GLOBAL_CACHE_DIR=$GITHUB_WORKSPACE/.zig-global-cache" >> "$GITHUB_ENV"
      - name: Check formatting with wazig fmt
        run: wazig fmt --check src/ tests/ examples/ lib/js-bridge/src/ build.zig web_build.zig tools/

  wasm:
    name: wasm32-wasi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install wazig and Wasmtime
        uses: cataggar/ghr/actions/install@v0.10.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.17.0-wazig.4
            bytecodealliance/wasmtime@v50.0.1
      - name: Cache Zig and Wasmtime
        uses: actions/cache@v4
        with:
          path: |
            .zig-global-cache
            ~/.cache/wasmtime
          key: wazig-cache-${{ runner.os }}-${{ hashFiles('build.zig.zon', 'build.zig', 'web_build.zig') }}
          restore-keys: |
            wazig-cache-${{ runner.os }}-
      - name: Configure Wasmtime cache
        run: |
          mkdir -p "$HOME/.cache/wasmtime/cache" "$GITHUB_WORKSPACE/.zig-global-cache"
          cat > "$HOME/.cache/wasmtime/config.toml" <<EOF
          [cache]
          enabled = true
          directory = "$HOME/.cache/wasmtime/cache"
          EOF
          echo "WASMTIME_CACHE_CONFIG=$HOME/.cache/wasmtime/config.toml" >> "$GITHUB_ENV"
          echo "ZIG_GLOBAL_CACHE_DIR=$GITHUB_WORKSPACE/.zig-global-cache" >> "$GITHUB_ENV"
      - name: lib/js-bridge
        run: ./wazig-build test --build-root lib/js-bridge -Dtarget=wasm32-wasi -fwasmtime
      - name: knots (webgpu)
        run: ./wazig-build test -Dtarget=wasm32-wasi -Dgpu_backend=webgpu -fwasmtime
      - name: knots (webgl2)
        run: ./wazig-build test -Dtarget=wasm32-wasi -Dgpu_backend=webgl2 -fwasmtime
      - name: knots (webgpu + web_threads)
        run: ./wazig-build test -Dtarget=wasm32-wasi -Dgpu_backend=webgpu -Dweb_threads=true -fwasmtime

  wasm-build:
    name: wasm32-freestanding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install wazig and Wasmtime
        uses: cataggar/ghr/actions/install@v0.10.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.17.0-wazig.4
            bytecodealliance/wasmtime@v50.0.1
      - name: Cache Zig and Wasmtime
        uses: actions/cache@v4
        with:
          path: |
            .zig-global-cache
            ~/.cache/wasmtime
          key: wazig-cache-${{ runner.os }}-${{ hashFiles('build.zig.zon', 'build.zig', 'web_build.zig') }}
          restore-keys: |
            wazig-cache-${{ runner.os }}-
      - name: Configure Wasmtime cache
        run: |
          mkdir -p "$HOME/.cache/wasmtime/cache" "$GITHUB_WORKSPACE/.zig-global-cache"
          cat > "$HOME/.cache/wasmtime/config.toml" <<EOF
          [cache]
          enabled = true
          directory = "$HOME/.cache/wasmtime/cache"
          EOF
          echo "WASMTIME_CACHE_CONFIG=$HOME/.cache/wasmtime/config.toml" >> "$GITHUB_ENV"
          echo "ZIG_GLOBAL_CACHE_DIR=$GITHUB_WORKSPACE/.zig-global-cache" >> "$GITHUB_ENV"
      - name: Build playground (webgpu)
        run: ./wazig-build --build-root examples/playground -Dtarget=wasm32-freestanding -Dgpu_backend=webgpu
      - name: Build playground (webgl2)
        run: ./wazig-build --build-root examples/playground -Dtarget=wasm32-freestanding -Dgpu_backend=webgl2
      - name: Build playground (webgpu + web_threads)
        run: ./wazig-build --build-root examples/playground -Dtarget=wasm32-freestanding -Dgpu_backend=webgpu -Dweb_threads=true
      - name: Build playground (webgl2 + web_threads)
        run: ./wazig-build --build-root examples/playground -Dtarget=wasm32-freestanding -Dgpu_backend=webgl2 -Dweb_threads=true

  benchmark:
    name: wazig benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install wazig and Wasmtime
        uses: cataggar/ghr/actions/install@v0.10.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.17.0-wazig.4
            cataggar/zig@v0.17.0-wazigl.4 ?id=wazigl
            bytecodealliance/wasmtime@v50.0.1
      - name: Cache Zig and Wasmtime
        uses: actions/cache@v4
        with:
          path: |
            .zig-global-cache
            ~/.cache/wasmtime
          key: wazig-cache-${{ runner.os }}-${{ hashFiles('build.zig.zon', 'build.zig', 'web_build.zig') }}
          restore-keys: |
            wazig-cache-${{ runner.os }}-
      - name: Configure Wasmtime cache
        run: |
          mkdir -p "$HOME/.cache/wasmtime/cache" "$GITHUB_WORKSPACE/.zig-global-cache"
          cat > "$HOME/.cache/wasmtime/config.toml" <<EOF
          [cache]
          enabled = true
          directory = "$HOME/.cache/wasmtime/cache"
          EOF
          echo "WASMTIME_CACHE_CONFIG=$HOME/.cache/wasmtime/config.toml" >> "$GITHUB_ENV"
          echo "ZIG_GLOBAL_CACHE_DIR=$GITHUB_WORKSPACE/.zig-global-cache" >> "$GITHUB_ENV"
      - name: Verify toolchain
        run: |
          wazig version
          wazigl version
          wasmtime --version
      - name: Run wazig CI benchmarks and publish summary
        run: python3 scripts/bench-wazig.py --ci-summary >> "$GITHUB_STEP_SUMMARY"
