name: Deploy playground

on:
  push:
    branches: [main]
    paths:
      - "examples/playground/**"
      - "src/**"
      - "lib/**"
      - "build.zig"
      - "build.zig.zon"
      - "web_build.zig"
      - ".github/workflows/playground.yml"
  workflow_dispatch:

concurrency:
  group: deploy-playground
  cancel-in-progress: false

permissions:
  contents: read
  attestations: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install wazig and Wasmtime
        uses: cataggar/ghr/actions/install@v0.10.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.17.0-wazig.4
            bytecodealliance/wasmtime@v50.0.1
      - name: Cache Zig and Wasmtime
        uses: actions/cache@v4
        with:
          path: |
            .zig-global-cache
            ~/.cache/wasmtime
          key: wazig-cache-${{ runner.os }}-${{ hashFiles('build.zig.zon', 'build.zig', 'web_build.zig') }}
          restore-keys: |
            wazig-cache-${{ runner.os }}-
      - name: Configure Wasmtime cache
        run: |
          mkdir -p "$HOME/.cache/wasmtime/cache" "$GITHUB_WORKSPACE/.zig-global-cache"
          cat > "$HOME/.cache/wasmtime/config.toml" <<EOF
          [cache]
          enabled = true
          directory = "$HOME/.cache/wasmtime/cache"
          EOF
          echo "WASMTIME_CACHE_CONFIG=$HOME/.cache/wasmtime/config.toml" >> "$GITHUB_ENV"
          echo "ZIG_GLOBAL_CACHE_DIR=$GITHUB_WORKSPACE/.zig-global-cache" >> "$GITHUB_ENV"

      - name: Build playground (ReleaseSmall)
        run: |
          ./wazig-build --build-root examples/playground -Dtarget=wasm32-freestanding -Doptimize=ReleaseSmall
          test -s examples/playground/zig-out/web/app.wasm
          test -s examples/playground/zig-out/web/knots-webgl2.js
          cp examples/playground/_headers examples/playground/zig-out/web/

      - name: Deploy to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.152.0"
          workingDirectory: examples/playground

