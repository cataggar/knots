name: Deploy playground

on:
  push:
    branches: [main]
    paths:
      - "examples/playground/**"
      - "src/**"
      - "lib/**"
      - "build.zig"
      - "build.zig.zon"
      - "web_build.zig"
      - ".github/workflows/playground.yml"
  workflow_dispatch:

concurrency:
  group: deploy-playground
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build playground (ReleaseSmall)
        working-directory: examples/playground
        run: zig build -Dtarget=wasm32-freestanding -Doptimize=ReleaseSmall --summary all && cp _headers zig-out/web/

      - name: Deploy to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.152.0"
          workingDirectory: examples/playground

